# Power button and closing the cover = sleep. To override this locally, the drop-in's name must sort
# after "z13.conf" (for example /etc/systemd/logind.conf.d/zz-local.conf): drop-ins apply in filename
# order across directories, so "z13-anything.conf" loads first and loses to this file.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
# Docked (external monitor): closing the cover just turns the panel off.
HandleLidSwitchDocked=ignore
