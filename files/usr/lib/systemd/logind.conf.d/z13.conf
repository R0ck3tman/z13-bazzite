# Power button and closing the cover = sleep. `ujust z13-hibernate-setup` switches these to
# suspend-then-hibernate (/etc/systemd/logind.conf.d/z13-hibernate.conf) once a swapfile exists;
# without one, suspend-then-hibernate fails and closing the cover would do nothing.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
# Docked (external monitor): closing the cover just turns the panel off.
HandleLidSwitchDocked=ignore
